server:
  port: 7777

spring:
  application:
    name: crane-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:7772}/${MYSQL_DB:crane_workorder}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:crane}
    password: ${MYSQL_PASSWORD:crane123}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 60MB
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

crane:
  jwt:
    secret: ${CRANE_JWT_SECRET:crane-dev-secret-change-in-prod-0123456789abcdef}
    expire-hours: 720
  wechat:
    # 微信小程序登录（jscode2session）：生产用环境变量注入；留空表示微信登录通道未配置
    appid: ${WECHAT_APPID:}
    secret: ${WECHAT_SECRET:}
    # 未绑定手机号时签发的绑定凭据有效期（分钟）
    bind-ticket-minutes: 10
  sms:
    # 短信通道尚未接入真实供应商：生产必须设为 false，避免验证码 debugCode 回显
    mock: ${CRANE_SMS_MOCK:true}
  init:
    # 首次启动无账号时自动创建管理员（生产环境用环境变量覆盖）
    admin-phone: ${CRANE_ADMIN_PHONE:13800000000}
    admin-password: ${CRANE_ADMIN_PASSWORD:Admin@123}
  file:
    upload-dir: ${CRANE_FILE_DIR:./data/files}
  cors:
    # 生产经 Nginx 反代同源；本地联调默认放开
    allowed-origins: ${CRANE_CORS_ORIGINS:*}

logging:
  level:
    com.crane: info
    org.apache.ibatis: warn
