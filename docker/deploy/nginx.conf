# crane-nginx：HTTPS 入口 + 静态资源托管 + API 反向代理
# 证书目录：宿主 ${DEPLOY_DIR}/certs -> 容器 /etc/nginx/certs
# 生产域名：jndys.top（与微信小程序合法域名保持一致）

# HTTP：仅用于健康检查与跳转 HTTPS
server {
    listen 80 default_server;
    server_name jndys.top;

    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name jndys.top;

    # 腾讯云 SSL 证书（Nginx 版）：上传后统一重命名为以下两个文件
    ssl_certificate     /etc/nginx/certs/fullchain.crt;
    ssl_certificate_key /etc/nginx/certs/privkey.key;
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    client_max_body_size 60m;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 后台管理（Vue3 构建产物，history 路由）
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }
    location = /admin {
        return 301 /admin/;
    }
    location = / {
        return 302 /admin/;
    }

    # 移动端 H5（uni-app 产物，hash 路由）
    location /h5/ {
        try_files $uri $uri/ /h5/index.html;
    }

    # 数据大屏（history 路由）
    location /screen/ {
        try_files $uri $uri/ /screen/index.html;
    }

    # SSE 事件流：必须关闭缓冲并延长读超时，否则管理端实时推送会被 Nginx 截断
    location = /api/v1/notify/stream {
        proxy_pass http://crane-app:7777;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # 业务接口（后端容器内监听 7777）
    location /api/ {
        proxy_pass http://crane-app:7777;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location = /healthz {
        access_log off;
        return 200 "ok";
    }
}
