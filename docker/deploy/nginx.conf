# crane-nginx：静态资源托管 + API 反向代理（文档 08 §3）
server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    client_max_body_size 60m;

    # 后台管理（Vue3 构建产物，history 路由）
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
    }
    location = / {
        return 302 /admin/;
    }

    # 移动端 H5（uni-app 产物，hash 路由，相对路径资源）
    location /h5/ {
        alias /usr/share/nginx/html/h5/;
        try_files $uri $uri/ /h5/index.html;
    }

    # 数据大屏（二期）
    location /screen/ {
        alias /usr/share/nginx/html/screen/;
        try_files $uri $uri/ /screen/index.html;
    }

    # 业务接口
    location /api/ {
        proxy_pass http://crane-app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 上传的私有文件经签名链接访问（MVP 阶段静态托管 + 应用层鉴权，二期换签名链接）
    location /files/ {
        alias /data/files/;
        internal;
    }

    location = /healthz {
        return 200 "ok";
    }
}
